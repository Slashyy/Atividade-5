<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Formulário</h1>

    <form>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome">

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email">

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha">

        <label for="nascimento">Data de nascimento:</label>
        <input type="date" id="nascimento" name="nascimento">

        <label for="curso">Curso:</label>
        <select id="curso" name="curso">
            <option>Selecione</option>
            <option>Engenharia de Software</option>
            <option>Ciência da Computação</option>
            <option>Sistemas e Dados</option>
        </select>

        <p>Sexo:</p>
        <input type="radio" name="sexo" value="feminino"> Feminino<br>
        <input type="radio" name="sexo" value="masculino"> Masculino<br>
        <input type="radio" name="sexo" value="outro"> Outro

        <p>Interesses:</p>
        <input type="checkbox" name="interesses" value="programacao"> Programação<br>
        <input type="checkbox" name="interesses" value="design"> Design<br>
        <input type="checkbox" name="interesses" value="tecnologia"> Tecnologia

        <label for="comentarios">Comentários:</label>
        <textarea id="comentarios" name="comentarios" rows="4"></textarea>

        <label for="foto">Upload de foto:</label>
        <input type="file" id="foto" name="foto">

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
